name: Gaming Bot Auto Post

on:
  schedule:
    # 📸 Photo Bot Schedule (5 times a day)
    - cron: '30 4 * * *'  
    - cron: '30 7 * * *'  
    - cron: '30 11 * * *' 
    - cron: '0 15 * * *'  
    - cron: '30 16 * * *' 
    
    # 🎬 Reel Bot Schedule (2 times a day)
    - cron: '30 8 * * *'  
    - cron: '30 15 * * *' 
    
  workflow_dispatch: 

jobs:
  post_content:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pillow moviepy==1.0.3 huggingface_hub  # <- SDK Package install kiya

    - name: Run Appropriate Bot
      env:
        FB_TOKEN: ${{ secrets.FB_TOKEN }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}  # <- Sirf wahi tokens hain jo hamare paas hain
      run: |
        current_cron="${{ github.event.schedule }}"
        
        if [ "$current_cron" = "30 8 * * *" ] || [ "$current_cron" = "30 15 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "🎬 Target Matched: Running REEL Bot..."
          python reel_bot.py
        else
          echo "📸 Target Matched: Running PHOTO Bot..."
          python final_bot.py
        fi

    - name: Commit and Push changes (topics.json)
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add topics.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update used topics"
        git pull --rebase origin main
        git push origin main
        

name: Reels Bot Auto Post

on:
  schedule:
    # 5 Reel Posts Daily (Har 3 ghante ka gap taaki 402 Error na aaye)
    - cron: '0 4 * * *'   # 09:30 AM IST
    - cron: '0 7 * * *'   # 12:30 PM IST
    - cron: '0 10 * * *'  # 03:30 PM IST
    - cron: '0 13 * * *'  # 06:30 PM IST
    - cron: '0 16 * * *'  # 09:30 PM IST
    
  workflow_dispatch:      # Manual button run karne ke liye

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write 
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests Pillow moviepy==1.0.3
          sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick
          sudo sed -i '/pattern="@\*/d' /etc/ImageMagick-6/policy.xml

      # 🔥 FIX: Ab koi smart routing nahi. Sirf aur sirf Reels Bot chalega!
      - name: Run Reels Bot
        env:
          FB_TOKEN: ${{ secrets.FB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "🎬 Running Daily REEL Bot..."
          python reel_b

      - name: Commit and Push Updated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add topics.json
          git commit -m "Auto-update used topics [skip ci]" || echo "No changes to commit"
          git pull origin main --no-rebase -X ours
          git push origin main

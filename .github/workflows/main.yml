name: Gaming Bot Auto Post

on:
  schedule:
    - cron: '30 4 * * *'  # Photo
    - cron: '30 7 * * *'  # Photo
    - cron: '30 8 * * *'  # Reel
    - cron: '30 11 * * *' # Photo
    - cron: '30 15 * * *' # Reel
    - cron: '0 15 * * *'  # Photo
    - cron: '30 16 * * *' # Photo
  workflow_dispatch: 

jobs:
  post_content:
    runs-on: ubuntu-latest  

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Required Libraries
      run: |
        pip install requests pillow moviepy

    - name: Run Bot
      env:
        FB_TOKEN: ${{ secrets.FB_TOKEN }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        if [ "${{ github.event.schedule }}" = "30 8 * * *" ] || [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then
          echo "🎬 Running REEL Bot..."
          python reel_bot.py
        else
          echo "📸 Running PHOTO Bot..."
          python final_bot.py
        fi

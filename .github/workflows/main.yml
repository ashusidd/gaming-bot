name: Gaming Bot Auto Post

on:
  schedule:
    - cron: '30 4 * * *'  
    - cron: '30 7 * * *'  
    - cron: '30 11 * * *' 
    - cron: '0 15 * * *'  
    - cron: '30 16 * * *' 
    - cron: '30 8 * * *'  
    - cron: '30 15 * * *' 
    
  workflow_dispatch: 

jobs:
  post_content:
    runs-on: self-hosted  # Yeh aapke local PC ke liye hai

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Run Bot
      env:
        FB_TOKEN: ${{ secrets.FB_TOKEN }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      shell: powershell
      run: |
        $current_cron = "${{ github.event.schedule }}"
        Write-Host "Current Schedule trigger is: $current_cron"
        
        # Check agar yeh Reel ka time hai ya manual trigger hai
        if ($current_cron -eq "30 8 * * *" -or $current_cron -eq "30 15 * * *" -or "${{ github.event_name }}" -eq "workflow_dispatch") {
            Write-Host "🎬 Target Matched: Running REEL Bot..."
            python reel_bot.py
        } else {
            Write-Host "📸 Target Matched: Running PHOTO Bot..."
            python final_bot.py
        }

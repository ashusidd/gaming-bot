name: Gaming Bot Auto Post

on:
  schedule:
    - cron: '30 4 * * *'  
    - cron: '30 7 * * *'  
    - cron: '30 11 * * *' 
    - cron: '0 15 * * *'  
    - cron: '30 16 * * *' 
    - cron: '30 8 * * *'  
    - cron: '30 15 * * *' 
    
  workflow_dispatch: 

jobs:
  post_content:
    runs-on: self-hosted  # Ab ye aapke PC par chalega!

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Run Bot
      env:
        FB_TOKEN: ${{ secrets.FB_TOKEN }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        # Yeh aapke PC par file check karega
        if [ "${{ github.event.schedule }}" = "30 8 * * *" ] || [ "${{ github.event.schedule }}" = "30 15 * * *" ]; then
          python reel_bot.py
        else
          python final_bot.py
        fi

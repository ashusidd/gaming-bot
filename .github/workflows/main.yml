name: Gaming Bot Auto Post

on:
  schedule:
    # 📸 Photo Bot Schedule (5 times a day)
    - cron: '30 4 * * *'  # 10:00 AM IST
    - cron: '30 7 * * *'  # 01:00 PM IST
    - cron: '30 11 * * *' # 05:00 PM IST
    - cron: '0 15 * * *'  # 08:30 PM IST
    - cron: '30 16 * * *' # 10:00 PM IST
    
    # 🎬 Reel Bot Schedule (2 times a day)
    - cron: '30 8 * * *'  # 02:00 PM IST
    - cron: '30 15 * * *' # 09:00 PM IST
    
  workflow_dispatch: # Manual Run button ke liye

jobs:
  post_content:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pillow moviepy

    - name: Run Appropriate Bot
      env:
        # 🔥 YAHAN HAIN AAPKE TOKENS (Naya HF_TOKEN add ho gaya hai)
        FB_TOKEN: ${{ secrets.FB_TOKEN }}
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        current_cron="${{ github.event.schedule }}"
        
        # Agar current time Reel ka hai, ya fir aapne button dabakar manual run kiya hai
        if [ "$current_cron" = "30 8 * * *" ] || [ "$current_cron" = "30 15 * * *" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "🎬 Target Matched: Running REEL Bot..."
          python reel_bot.py
        else
          echo "📸 Target Matched: Running PHOTO Bot..."
          python final_bot.py
        fi

    - name: Commit and Push changes (topics.json)
      run: |
        git config --global user.name 'github-actions'
        git config --global user.email 'github-actions@github.com'
        git add topics.json
        # Agar JSON file mein koi change hua hai, tabhi push karega
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update used topics"
        git pull --rebase origin main
        git push origin main
        
